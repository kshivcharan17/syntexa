<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in &middot; Rate My Snap</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="icon" type="image/png" href="/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --yellow:#FFFC00;
    --ink:#111111;
    --paper:#FAFAF6;
    --coral:#FF5A36;
    --muted:#6E6E68;
    --card:#FFFFFF;
    --error:#D8351F;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:var(--paper);
    font-family:'Inter',sans-serif;
    color:var(--ink);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:32px 20px;
    position:relative;
    overflow-x:hidden;
  }
  .star{
    position:absolute;
    width:14px;height:14px;
    background:var(--ink);
    clip-path:polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);
    opacity:0.08;
    pointer-events:none;
  }
  .brand{
    display:flex;align-items:center;gap:10px;
    margin-bottom:36px;z-index:1;
  }
  .brand-mark{
    width:40px;height:40px;background:var(--yellow);
    border:2px solid var(--ink);border-radius:12px;
    display:flex;align-items:center;justify-content:center;font-size:20px;
  }
  .brand-name{
    font-family:'Space Grotesk',sans-serif;font-weight:700;
    font-size:20px;letter-spacing:-0.02em;
  }
  .card{
    background:var(--card);
    border:2px solid var(--ink);
    border-radius:20px;
    width:100%;max-width:400px;
    padding:40px 32px 32px;
    text-align:center;
    position:relative;z-index:1;
    box-shadow:6px 6px 0 var(--ink);
  }
  .eyebrow{
    font-size:12px;letter-spacing:0.12em;text-transform:uppercase;
    color:var(--muted);font-weight:500;margin-bottom:14px;
  }
  h1{
    font-family:'Space Grotesk',sans-serif;font-weight:700;
    font-size:28px;line-height:1.1;letter-spacing:-0.02em;margin:0 0 12px;
  }
  h1 span{background:var(--yellow);padding:0 6px;border-radius:4px;}
  p.sub{color:var(--muted);font-size:15px;line-height:1.5;margin:0 0 26px;}

  .field{text-align:left;margin-bottom:16px;}
  .field label{
    display:block;font-size:12px;font-weight:500;color:var(--muted);
    margin-bottom:6px;letter-spacing:0.02em;
  }
  .field input{
    width:100%;padding:12px 14px;border:2px solid var(--ink);border-radius:10px;
    font-family:'Inter',sans-serif;font-size:15px;background:var(--paper);color:var(--ink);
  }
  .field input:focus{outline:none;border-color:var(--coral);}

  .cta{
    display:block;width:100%;
    background:var(--ink);color:#fff;
    font-family:'Inter',sans-serif;font-weight:500;font-size:15px;
    padding:14px 20px;border:none;border-radius:10px;
    cursor:pointer;text-decoration:none;margin-top:8px;
  }
  .cta:hover{background:#000;}
  .cta:disabled{opacity:0.5;cursor:not-allowed;}
  .cta.secondary{
    background:none;color:var(--ink);border:2px solid var(--ink);margin-top:10px;
  }
  .cta.secondary:hover{background:var(--paper);}

  .error-msg{
    display:none;background:#FDEBE8;border:1px solid var(--error);color:var(--error);
    font-size:13px;padding:10px 12px;border-radius:8px;margin-bottom:16px;text-align:left;
  }
  .status-msg{
    display:none;font-size:13px;color:var(--muted);margin-bottom:16px;
  }

  .fineprint{margin-top:20px;font-size:12px;color:var(--muted);line-height:1.5;}
  footer{margin-top:28px;font-size:12px;color:var(--muted);z-index:1;}
  @media (max-width:420px){.card{padding:32px 22px 26px;}h1{font-size:24px;}}
</style>
</head>
<body>

  <div class="brand">
    <div class="brand-mark">&#128123;</div>
    <div class="brand-name">Rate My Snap</div>
  </div>

  <div class="card">

    <!-- Step 1: enter details -->
    <div id="step-details">
      <div class="eyebrow">Community ratings</div>
      <h1>Log in to <span>rate it.</span></h1>
      <p class="sub">Enter your Snapchat username and phone number to get started.</p>

      <div class="error-msg" id="details-error"></div>

      <form id="details-form">
        <div class="field">
          <label for="username">Snapchat username</label>
          <input type="text" id="username" placeholder="yourusername" autocomplete="username" required>
        </div>
        <div class="field">
          <label for="phone">Phone number</label>
          <input type="tel" id="phone" placeholder="9876543210" autocomplete="tel" required>
        </div>
        <button type="submit" class="cta" id="send-otp-btn">Send verification code</button>
      </form>

      <div class="fineprint">We'll text you a one-time code to verify your number. No spam, promise.</div>
    </div>

    <!-- Step 2: verify OTP -->
    <div id="step-otp" style="display:none;">
      <div class="eyebrow">Verify it's you</div>
      <h1>Enter the <span>code.</span></h1>
      <p class="sub" id="otp-sub">We sent a 6-digit code to your phone.</p>

      <div class="error-msg" id="otp-error"></div>
      <div class="status-msg" id="otp-status"></div>

      <form id="otp-form">
        <div class="field">
          <label for="otp">Verification code</label>
          <input type="text" id="otp" placeholder="123456" inputmode="numeric" autocomplete="one-time-code" maxlength="6" required>
        </div>
        <button type="submit" class="cta" id="verify-btn">Verify &amp; continue</button>
        <button type="button" class="cta secondary" id="back-btn">Use a different number</button>
      </form>
    </div>

  </div>

  <footer>ratemysnap.vercel.app</footer>

  <script>
    // ---- Supabase setup ----
    // Replace with your project's actual URL and anon/public key
    const SUPABASE_URL = 'https://ymkywclpmhyaghptjfkd.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inlta3l3Y2xwbWh5YWdocHRqZmtkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI0ODE1NzYsImV4cCI6MjA5ODA1NzU3Nn0.p_ZEEqOnTGV-z4J1cf6UnHVL0Hao_zh0sTlP6HfiFYo';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const detailsStep = document.getElementById('step-details');
    const otpStep = document.getElementById('step-otp');
    const detailsForm = document.getElementById('details-form');
    const otpForm = document.getElementById('otp-form');
    const detailsError = document.getElementById('details-error');
    const otpError = document.getElementById('otp-error');
    const otpStatus = document.getElementById('otp-status');
    const otpSub = document.getElementById('otp-sub');
    const sendOtpBtn = document.getElementById('send-otp-btn');
    const verifyBtn = document.getElementById('verify-btn');
    const backBtn = document.getElementById('back-btn');

    let pendingUsername = '';
    let pendingPhone = '';

    function showError(el, msg){
      el.textContent = msg;
      el.style.display = 'block';
    }
    function hideError(el){
      el.style.display = 'none';
    }
    function setLoading(btn, loading, label){
      btn.disabled = loading;
      btn.textContent = loading ? 'Please wait…' : label;
    }

    // Basic E.164-ish check: + followed by 8-15 digits.
    // If no country code is given, assume India (+91).
    function normalizePhone(raw){
      let trimmed = raw.trim().replace(/[\s-()]/g, '');

      if (!trimmed.startsWith('+')) {
        // strip a leading 0 (common local-dialing habit) before prefixing +91
        trimmed = trimmed.replace(/^0+/, '');
        trimmed = '+91' + trimmed;
      }

      return /^\+[1-9]\d{7,14}$/.test(trimmed) ? trimmed : null;
    }

    // Step 1: submit username + phone -> send OTP
    detailsForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideError(detailsError);

      const username = document.getElementById('username').value.trim();
      const phoneRaw = document.getElementById('phone').value;
      const phone = normalizePhone(phoneRaw);

      if (!username) {
        showError(detailsError, 'Enter your Snapchat username.');
        return;
      }
      if (!phone) {
        showError(detailsError, 'Enter a valid phone number in international format, e.g. +919876543210.');
        return;
      }

      setLoading(sendOtpBtn, true, 'Send verification code');

      const { error } = await supabaseClient.auth.signInWithOtp({ phone });

      setLoading(sendOtpBtn, false, 'Send verification code');

      if (error) {
        showError(detailsError, error.message || 'Could not send code. Try again.');
        return;
      }

      pendingUsername = username;
      pendingPhone = phone;
      otpSub.textContent = `We sent a 6-digit code to ${phone}.`;
      detailsStep.style.display = 'none';
      otpStep.style.display = 'block';
    });

    // Step 2: verify OTP -> upsert profile -> redirect
    otpForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideError(otpError);
      otpStatus.style.display = 'none';

      const token = document.getElementById('otp').value.trim();
      if (!/^\d{6}$/.test(token)) {
        showError(otpError, 'Enter the 6-digit code.');
        return;
      }

      setLoading(verifyBtn, true, 'Verify & continue');

      const { data, error } = await supabaseClient.auth.verifyOtp({
        phone: pendingPhone,
        token,
        type: 'sms'
      });

      if (error) {
        setLoading(verifyBtn, false, 'Verify & continue');
        showError(otpError, error.message || 'Invalid or expired code.');
        return;
      }

      const user = data.user;

      // Upsert into profiles: id must match auth.users.id
      const { error: profileError } = await supabaseClient
        .from('profiles')
        .upsert({
          id: user.id,
          snapchat_username: pendingUsername,
          phone_number: pendingPhone
        }, { onConflict: 'id' });

      setLoading(verifyBtn, false, 'Verify & continue');

      if (profileError) {
        // Likely a unique constraint hit (username or phone already taken)
        showError(otpError, profileError.message.includes('duplicate')
          ? 'That username or phone number is already in use.'
          : (profileError.message || 'Could not save your profile.'));
        return;
      }

      otpStatus.textContent = 'You\'re verified! Redirecting…';
      otpStatus.style.display = 'block';

      setTimeout(() => {
        window.location.href = '/'; // send them back to the rating page
      }, 900);
    });

    backBtn.addEventListener('click', () => {
      otpStep.style.display = 'none';
      detailsStep.style.display = 'block';
      hideError(otpError);
      document.getElementById('otp').value = '';
    });

    // decorative background stars
    (function(){
      const n = 16;
      for(let i=0;i<n;i++){
        const s = document.createElement('div');
        s.className='star';
        s.style.left = Math.random()*100+'vw';
        s.style.top = Math.random()*100+'vh';
        const scale = 0.6 + Math.random()*1.8;
        s.style.transform = `scale(${scale}) rotate(${Math.random()*40-20}deg)`;
        document.body.appendChild(s);
      }
    })();
  </script>

</body>
</html>
