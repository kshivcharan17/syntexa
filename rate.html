<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rate My Snap</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --yellow:#FFFC00;
    --ink:#111111;
    --paper:#FAFAF6;
    --coral:#FF5A36;
    --muted:#6E6E68;
    --card:#FFFFFF;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;min-height:100vh;background:var(--paper);
    font-family:'Inter',sans-serif;color:var(--ink);
    display:flex;flex-direction:column;align-items:center;
    padding:32px 20px 60px;position:relative;overflow-x:hidden;
  }
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:40px;}
  .brand-mark{
    width:40px;height:40px;background:var(--yellow);
    border:2px solid var(--ink);border-radius:12px;
    display:flex;align-items:center;justify-content:center;font-size:20px;
  }
  .brand-name{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:20px;letter-spacing:-0.02em;}

  /* Loading scene */
  #loading-scene{
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    min-height:50vh;width:100%;
  }
  .spin-star{
    width:56px;height:56px;background:var(--coral);
    clip-path:polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);
    animation:spin 1.1s linear infinite;
    margin-bottom:22px;
  }
  @keyframes spin{ to { transform: rotate(360deg); } }
  .loading-text{
    font-family:'Space Grotesk',sans-serif;font-weight:500;font-size:16px;
    margin-bottom:6px;
  }
  .loading-sub{font-size:13px;color:var(--muted);}
  .dot-row{display:flex;gap:6px;margin-top:16px;}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--ink);opacity:0.2;animation:pulse 1.2s ease-in-out infinite;}
  .dot:nth-child(2){animation-delay:0.15s;}
  .dot:nth-child(3){animation-delay:0.3s;}
  @keyframes pulse{ 0%,80%,100%{opacity:0.2;} 40%{opacity:1;} }

  /* Content */
  #rating-content{display:none;width:100%;max-width:520px;}
  .top-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;}
  .hello{font-size:14px;color:var(--muted);}
  .hello strong{color:var(--ink);font-weight:500;}
  .snap-card{
    background:var(--card);border:2px solid var(--ink);border-radius:20px;
    padding:26px;margin-bottom:20px;box-shadow:6px 6px 0 var(--ink);
  }
  .snap-thumb{
    width:100%;aspect-ratio:4/5;background:var(--yellow);border:2px solid var(--ink);
    border-radius:14px;margin-bottom:16px;overflow:hidden;
  }
  .snap-thumb img{
    width:100%;height:100%;object-fit:cover;display:block;
  }
  .snap-meta{font-size:13px;color:var(--muted);margin-bottom:14px;}
  .stars-row{display:flex;gap:8px;margin-bottom:18px;}
  .star-btn{
    width:34px;height:34px;background:none;border:none;cursor:pointer;padding:0;
    clip-path:polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);
    background-color:#E4E2DA;
  }
  .star-btn.active{background-color:var(--coral);}
  .cta{
    display:block;width:100%;background:var(--ink);color:#fff;
    font-family:'Inter',sans-serif;font-weight:500;font-size:15px;
    padding:14px 20px;border:none;border-radius:10px;cursor:pointer;
  }
  .cta:hover{background:#000;}
  footer{margin-top:32px;font-size:12px;color:var(--muted);}
</style>
</head>
<body>

  <div class="brand">
    <div class="brand-mark">&#128123;</div>
    <div class="brand-name">Rate My Snap</div>
  </div>

  <div id="loading-scene">
    <div class="spin-star"></div>
    <div class="loading-text">Pulling up today's Snaps</div>
    <div class="loading-sub">This only takes a second</div>
    <div class="dot-row"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
  </div>

  <div id="rating-content">
    <div class="top-row">
      <div class="hello">Hey, <strong id="user-greeting">there</strong></div>
    </div>

    <div class="snap-card">
      <div class="snap-thumb">
        <!-- Replace with the direct image URL, e.g. https://i.pinimg.com/originals/xx/xx/xx/xxxx.jpg
             (right-click the image on the Pinterest pin -> "Copy image address") -->
        <img src="https://ibb.co/vxysjqGN" alt="Snap">
      </div>
      <div class="snap-meta">Posted by @thashi &middot; 2h ago</div>
      <div class="stars-row" id="star-picker">
        <button class="star-btn" data-value="1" aria-label="Rate 1 star"></button>
        <button class="star-btn" data-value="2" aria-label="Rate 2 stars"></button>
        <button class="star-btn" data-value="3" aria-label="Rate 3 stars"></button>
        <button class="star-btn" data-value="4" aria-label="Rate 4 stars"></button>
        <button class="star-btn" data-value="5" aria-label="Rate 5 stars"></button>
      </div>
      <button class="cta" id="submit-rating">Submit rating</button>
    </div>
  </div>

  <footer>ratemysnap.vercel.app</footer>

  <script>
    // Greet with stored username if present
    const savedUsername = sessionStorage.getItem('rms_username');
    if (savedUsername) {
      document.getElementById('user-greeting').textContent = savedUsername;
    }

    // Simulated loading scene, swap for a real fetch when the backend is ready
    setTimeout(() => {
      document.getElementById('loading-scene').style.display = 'none';
      document.getElementById('rating-content').style.display = 'block';
    }, 1400);

    // Star picker interaction
    let selected = 0;
    const buttons = document.querySelectorAll('.star-btn');
    buttons.forEach(btn => {
      btn.addEventListener('click', () => {
        selected = parseInt(btn.dataset.value, 10);
        buttons.forEach(b => {
          b.classList.toggle('active', parseInt(b.dataset.value, 10) <= selected);
        });
      });
    });

    document.getElementById('submit-rating').addEventListener('click', () => {
      if (!selected) {
        alert('Pick a star rating first.');
        return;
      }
      alert('Thanks! You rated this Snap ' + selected + ' star' + (selected > 1 ? 's' : '') + '.');
    });
  </script>

</body>
</html>
