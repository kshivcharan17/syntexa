<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rate My Snap</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="icon" type="image/png" href="/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --yellow:#FFFC00;
    --ink:#111111;
    --paper:#FAFAF6;
    --coral:#FF5A36;
    --muted:#6E6E68;
    --card:#FFFFFF;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:var(--paper);
    font-family:'Inter',sans-serif;
    color:var(--ink);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:32px 20px;
    position:relative;
    overflow-x:hidden;
  }
  .star{
    position:absolute;
    width:14px;height:14px;
    background:var(--ink);
    clip-path:polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);
    opacity:0.08;
    pointer-events:none;
  }
  .brand{
    display:flex;align-items:center;gap:10px;
    margin-bottom:36px;z-index:1;
  }
  .brand-mark{
    width:40px;height:40px;background:var(--yellow);
    border:2px solid var(--ink);border-radius:12px;
    display:flex;align-items:center;justify-content:center;font-size:20px;
  }
  .brand-name{
    font-family:'Space Grotesk',sans-serif;font-weight:700;
    font-size:20px;letter-spacing:-0.02em;
  }
  .card{
    background:var(--card);
    border:2px solid var(--ink);
    border-radius:20px;
    width:100%;max-width:400px;
    padding:40px 32px 32px;
    text-align:center;
    position:relative;z-index:1;
    box-shadow:6px 6px 0 var(--ink);
  }
  .eyebrow{
    font-size:12px;letter-spacing:0.12em;text-transform:uppercase;
    color:var(--muted);font-weight:500;margin-bottom:14px;
  }
  h1{
    font-family:'Space Grotesk',sans-serif;font-weight:700;
    font-size:32px;line-height:1.1;letter-spacing:-0.02em;margin:0 0 12px;
  }
  h1 span{background:var(--yellow);padding:0 6px;border-radius:4px;}
  p.sub{color:var(--muted);font-size:15px;line-height:1.5;margin:0 0 28px;}
  .cta{
    display:block;width:100%;
    background:var(--ink);color:#fff;
    font-family:'Inter',sans-serif;font-weight:500;font-size:15px;
    padding:14px 20px;border:none;border-radius:10px;
    cursor:pointer;text-decoration:none;
  }
  .cta:hover{background:#000;}
  .fineprint{margin-top:20px;font-size:12px;color:var(--muted);line-height:1.5;}
  .stars-row{display:flex;justify-content:center;gap:6px;margin:0 0 20px;}
  .stars-row .pip{
    width:18px;height:18px;background:var(--coral);
    clip-path:polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);
  }
  footer{margin-top:28px;font-size:12px;color:var(--muted);z-index:1;}
  @media (max-width:420px){.card{padding:32px 22px 26px;}h1{font-size:26px;}}
</style>
</head>
<body>

  <div class="brand">
    <div class="brand-mark">&#128123;</div>
    <div class="brand-name">Rate My Snap</div>
  </div>

  <div class="card">
    <div class="eyebrow">Community ratings</div>
    <div class="stars-row">
      <div class="pip"></div><div class="pip"></div><div class="pip"></div><div class="pip"></div><div class="pip"></div>
    </div>
    <h1>Post it. Let them <span>rate it.</span></h1>
    <p class="sub">Share a Snap and get honest star ratings from the community. Log in to get started.</p>

    <a class="cta" href="/login">Log in to rate</a>

    <div class="fineprint">You'll be asked for your Snapchat username and phone number so we can set up your profile.</div>
  </div>

  <footer>ratemysnap.vercel.app</footer>

  <script>
    (function(){
      const n = 16;
      for(let i=0;i<n;i++){
        const s = document.createElement('div');
        s.className='star';
        s.style.left = Math.random()*100+'vw';
        s.style.top = Math.random()*100+'vh';
        const scale = 0.6 + Math.random()*1.8;
        s.style.transform = `scale(${scale}) rotate(${Math.random()*40-20}deg)`;
        document.body.appendChild(s);
      }
    })();
  </script>

</body>
</html>
